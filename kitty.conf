# Kitty configuration
# Reload without restarting: ctrl+cmd+, (macOS)

# Fonts
font_size 14.0

# Colors
include theme.conf

# Window
background_opacity 0.90
dynamic_background_opacity yes
background_blur 40
macos_titlebar_color background
macos_traditional_fullscreen yes
draw_minimal_borders no
window_border_width 2pt
window_margin_width 1.2 1.5
window_padding_width 2 6

# Mouse
focus_follows_mouse yes

# Keyboard: option acts as alt (fzf option+c, word jumps in the shell)
macos_option_as_alt yes

# Keyboard: move panes by direction
map cmd+shift+left  move_window left
map cmd+shift+right move_window right
map cmd+shift+up    move_window up
map cmd+shift+down  move_window down

# Keyboard: focus pane by direction
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
